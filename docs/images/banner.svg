<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Penpot Android">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141A3D"/>
      <stop offset="0.55" stop-color="#0C1128"/>
      <stop offset="1" stop-color="#05070F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.14" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#31EFB9" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#31EFB9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#9B7BFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9B7BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31EFB9"/>
      <stop offset="0.5" stop-color="#4F9BFF"/>
      <stop offset="1" stop-color="#9B7BFF"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <rect width="1280" height="400" fill="url(#glow2)"/>

  <!-- 细网格 -->
  <g stroke="#2A3557" stroke-width="1" opacity="0.35">
    <path d="M0 100 H1280 M0 200 H1280 M0 300 H1280"/>
    <path d="M200 0 V400 M400 0 V400 M600 0 V400 M800 0 V400 M1000 0 V400 M1200 0 V400"/>
  </g>

  <!-- 图标：等距线描开口盒 -->
  <g transform="translate(76,96) scale(0.42)">
    <rect x="-12" y="-12" width="536" height="536" rx="118" fill="#0B0D14"/>
    <rect x="-12" y="-12" width="536" height="536" rx="118" fill="none" stroke="#232B45" stroke-width="4"/>
    <g fill="none" stroke="#F2F5FF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,10)">
      <path d="M256 360 L356 302 L356 206 L256 264 Z" fill="#FFFFFF" fill-opacity="0.04"/>
      <path d="M256 360 L156 302 L156 206 L256 264 Z" fill="#FFFFFF" fill-opacity="0.10"/>
      <path d="M256 360 L156 302 M256 360 L356 302 M256 360 L256 264 M156 206 L256 264 L356 206 M256 148 L156 206 M256 148 L356 206"/>
      <g fill="#FFFFFF" fill-opacity="0.075">
        <path d="M156 206 L256 148 L232 96 L132 154 Z"/>
        <path d="M356 206 L256 148 L280 96 L380 154 Z"/>
        <path d="M256 264 L156 206 L128 258 L228 316 Z"/>
        <path d="M256 264 L356 206 L384 258 L284 316 Z"/>
      </g>
    </g>
  </g>

  <!-- 标题 -->
  <text x="330" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="72" font-weight="700" fill="#F2F5FF" letter-spacing="0.5">Penpot Android</text>

  <rect x="332" y="196" width="74" height="4" rx="2" fill="url(#brand)"/>

  <text x="332" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="30" font-weight="500" fill="#31EFB9">在手机上运行完整 Penpot 设计服务</text>

  <text x="332" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="23" fill="#8791B2">No Docker · No Root · One Tap · LAN Access</text>

  <text x="332" y="342" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="20" fill="#9B7BFF">github.com/Hochan666/penpot-android</text>

  <!-- 右下角小字 -->
  <text x="1204" y="372" text-anchor="end" font-family="ui-monospace, monospace" font-size="17" fill="#5A648A">v2.4</text>
</svg>
